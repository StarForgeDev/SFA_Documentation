<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% if page.title %}{{ page.title }} | {% endif %}{{ site.title }}</title>
    <meta name="description" content="{{ page.description | default: site.description }}">
    <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
  </head>
  <body>
    <header class="site-header">
      <a class="brand" href="{{ '/' | relative_url }}">
        <span class="brand-mark">SFA</span>
        <span>StarForge Armory Docs</span>
      </a>
      <nav aria-label="Main navigation">
        <a href="{{ '/modules/' | relative_url }}">Modules</a>
        <a href="{{ '/factions/' | relative_url }}">Factions</a>
        <a href="{{ '/reference/classnames/' | relative_url }}">Classnames</a>
        <a href="{{ '/gadgets/' | relative_url }}">Gadgets</a>
      </nav>
    </header>
    <main class="page">
      {{ content }}
    </main>
    <footer class="site-footer">
      <span>StarForge Armory documentation.</span>
      <span>Source-confirmed notes should be verified in packed Arma builds before release decisions.</span>
    </footer>
  </body>
</html>
